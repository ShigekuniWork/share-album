language: 'unknown'

tasks:
  docker-up:
    type: run
    description: Docker composeの起動
    command: docker compose up
    options:
      cache: false
      runInCI: false

  docker-down:
    type: run
    description: Docker composeの停止
    command: docker compose down
    options:
      cache: false
      runInCI: false
  
  betterleaks:
    type: test
    description: リポジトリ全体の秘密情報の漏えいを検査する
    command: betterleaks git .
    options:
      cache: false
      runInCI: always

  betterleaks-staged:
    type: test
    description: ステージ済みの変更から秘密情報の漏えいを検査する
    command: betterleaks git . --pre-commit --staged
    options:
      cache: false
      runInCI: false

  commit-message:
    type: test
    description: コミットメッセージが形式に従っているか検証する
    command: bash scripts/commit-message.sh "$ARG1"
    options:
      runInCI: false

  pre-commit:
    type: test
    description: pre-commit時のタスク
    deps:
      - betterleaks-staged
      - server:lint
      - server:audit
      - github:actionlint
      - github:zizmor 
    options:
      runInCI: false
