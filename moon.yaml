language: 'unknown'

tasks:
  betterleaks:
    type: test
    description: リポジトリ全体の秘密情報の漏えいを検査する
    command: betterleaks git .
    options:
      cache: false
      runInCI: always

  betterleaks-staged:
    type: test
    description: ステージ済みの変更から秘密情報の漏えいを検査する
    command: betterleaks git . --pre-commit --staged
    options:
      cache: false
      runInCI: false

  golang-lint:
    type: run
    description: Goのソースコードを静的解析する
    command: golangci-lint run ./...
    options:
      runInCI: always

  golang-audit:
    type: run
    description: Goの依存関係に既知の脆弱性がないか検査する
    command: govulncheck ./...
    options:
      runInCI: always

  commit-message:
    type: test
    description: コミットメッセージが形式に従っているか検証する
    command: bash scripts/commit-message.sh "$ARG1"
    options:
      runInCI: false

  pre-commit:
    type: test
    description: pre-commit時のタスク
    deps:
      - betterleaks-staged
      - golang-lint
      - golang-audit
    options:
      runInCI: false