name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5 # v4.38.2
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/autobuild@2892aa5 # v4.38.2

      - uses: github/codeql-action/analyze@2892aa5 # v4.38.2
